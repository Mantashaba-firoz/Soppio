<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soppio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="upperNavbar">
            <div class="logo">Soppio</div>
            <div  class="searchBar">
                <input type="search" placeholder="Search" class="search" />
                <div class="searchIcon"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>
            <div class="mainOptions">
                <a href="#" class="like option"><i class="fa-regular fa-heart"></i></a>
                <a href="#" class="cart option"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="#" class="profile option"><i class="fa-regular fa-user"></i></a>
            </div>
        </div>
        <div class="lowerNavbar"></div>
    </nav>
</body>
</html>
